name: Coverage Pages

# Builds gcovr HTML coverage for the UT suites (private/public/combined) and
# the integration test, assembles a tiny index linking all four, and deploys
# it to GitHub Pages. Runs only on master pushes — coverage from a PR branch
# or a tag shouldn't overwrite the published report, and deploying from
# untrusted PR code to a Pages environment is a real supply-chain risk this
# repo doesn't need to take on.
#
# One-time manual step (cannot be done from a workflow file): in the repo's
# Settings -> Pages, set "Build and deployment: Source" to "GitHub Actions".
# Until that's set, this workflow's deploy-pages step fails with a clear
# "Pages site not found" error — that's the signal to go flip the setting.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-coverage:
    name: Build coverage HTML
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcmocka-dev gcovr
      - name: Build UT coverage (private + public + combined)
        run: ./utils/build_UTs.sh
      - name: Build integration-test coverage
        run: ./utils/build_ITs.sh
      - name: Assemble Pages site
        run: |
          SITE_DIR="build/coverage-site"
          mkdir -p "${SITE_DIR}/uts-private" "${SITE_DIR}/uts-public" "${SITE_DIR}/uts-all" "${SITE_DIR}/its"

          cp -r tests/results/private_UTs/. "${SITE_DIR}/uts-private/" 2>/dev/null || true
          cp -r tests/results/public_UTs/.  "${SITE_DIR}/uts-public/"  2>/dev/null || true
          cp -r tests/results/UTs_all/.     "${SITE_DIR}/uts-all/"     2>/dev/null || true
          cp -r tests/results/ITs/.         "${SITE_DIR}/its/"         2>/dev/null || true

          cat > "${SITE_DIR}/index.html" <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>EMlog coverage</title>
          <style>
            body { font: 16px system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
            h1 { font-size: 1.4rem; }
            ul { line-height: 2; }
          </style>
          </head>
          <body>
          <h1>EMlog coverage reports</h1>
          <ul>
            <li><a href="uts-all/UTs_all_coverage.html">Unit tests — combined (private + public)</a></li>
            <li><a href="uts-private/UTs_private_coverage.html">Unit tests — private (white-box)</a></li>
            <li><a href="uts-public/UTs_public_coverage.html">Unit tests — public (black-box)</a></li>
            <li><a href="its/ITs_coverage.html">Integration test</a></li>
          </ul>
          <p>Regenerated on every push to <code>master</code> by <code>coverage-pages.yml</code>.</p>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: build/coverage-site

  deploy:
    name: Deploy to GitHub Pages
    needs: build-coverage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
