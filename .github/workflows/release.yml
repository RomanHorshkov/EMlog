name: Release

# Full reusable Quality gate must pass before anything is published. Fires on a v* tag push or
# a published GitHub Release; validates the tag matches VERSION, builds the hardened package,
# generates checksums, then uploads to the GitHub Release.
#
# No build-provenance attestation here: actions/attest-build-provenance is unavailable for
# user-owned private repositories (same GitHub platform wall as CodeQL in security.yml), and
# it hard-fails the job rather than degrading gracefully. Re-add it (mirroring uuid7/SPSCring/
# MPSCring's own release.yml) if/when the repo goes public or moves to an org with GHAS.

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a release mid-flight

jobs:
  quality-gate:
    name: Quality gate
    uses: ./.github/workflows/quality.yml

  publish:
    name: Build, sign, and publish
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write       # upload release assets
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Read version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          EXPECTED_TAG="v${{ steps.version.outputs.value }}"
          ACTUAL_TAG="${GITHUB_REF_NAME}"
          if [ "$ACTUAL_TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag/version mismatch: expected $EXPECTED_TAG but got $ACTUAL_TAG"
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config fakeroot

      - name: Build .deb
        run: ./utils/build_deb.sh

      - name: Upload package to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            build/debs/*.deb
            build/debs/SHA256SUMS
