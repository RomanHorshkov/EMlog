name: Quality

# Connected graph, not several independent workflows racing each other on every push:
#
#   build
#     +-- compiler-portability -----------------------------+
#     +-- unit-tests-coverage (private+public UTs)           +--> package-smoke
#     +-- integration -> sanitizers + thread-sanitizer
#
# Also invocable as a reusable workflow (workflow_call) so release.yml can require it to pass
# before cutting a release, instead of re-implementing the same gate. Mirrors the architecture
# shared by uuid7/SPSCring/MPSCring's own quality.yml.

on:
  push:
    # Tag pushes are release cuts: release.yml's quality-gate job already invokes THIS
    # file via workflow_call for that exact ref. Without this exclusion a tag push fires
    # Quality twice — once directly, once nested inside Release — and while they no longer
    # deadlock (see the concurrency group below), the direct one is pure waste: it just gets
    # cancelled by the nested one (or vice versa) every single release.
    tags-ignore:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # NOT `github.workflow` here: inside a workflow_call invocation (release.yml's
  # quality-gate job calls this file), `github.workflow` resolves to the CALLER's name
  # ("Release"), not this file's own name. Release also groups on
  # `${{ github.workflow }}-${{ github.ref }}`, so both end up computing the IDENTICAL
  # group ("Release-refs/tags/vX.Y.Z") for the same tag push — the parent run occupies
  # that group waiting on quality-gate, and quality-gate can never start because its own
  # parent already holds the group it needs. GitHub detects and cancels this as a
  # deadlock (confirmed live in uuid7, fixed there in commit 43ff27d). A hardcoded literal
  # prefix keeps this file's group stable and distinct regardless of who calls it.
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (all profiles)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config
      - name: Build libraries
        run: ./utils/build_libs.sh

  compiler-portability:
    name: Strict compile (${{ matrix.compiler }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang
      - name: Compile the library with strict diagnostics
        run: |
          ${{ matrix.compiler }} -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
              -Iapp -c app/emlog.c -o /tmp/emlog-${{ matrix.compiler }}.o

  unit-tests-coverage:
    name: Private + public UTs, combined coverage
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcmocka-dev gcovr jq
      - name: Release UTs (private + public, -O2, real assertions)
        run: ./utils/build_UTs_release.sh
      - name: Coverage UTs (private + public, combined gcovr report)
        run: ./utils/build_UTs.sh
      - name: Upload coverage artifacts (HTML/XML/JSON)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uts-coverage
          if-no-files-found: warn
          path: |
            tests/results/private_UTs
            tests/results/public_UTs
            tests/results/UTs_all

  integration:
    name: Multi-threaded integration test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcovr
      - name: Build and run the integration test (coverage)
        run: ./utils/build_ITs.sh
      - name: Build and run the integration test (release profile, the real gate)
        run: ./utils/build_ITs_release.sh
      - name: Upload integration result + coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-result
          if-no-files-found: warn
          path: tests/results/ITs

  sanitizers:
    name: ASan, UBSan, LSan (UTs + IT)
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcmocka-dev
      - name: Build and run sanitized UTs and IT
        run: ./utils/build_sanitizer_tests.sh

  thread-sanitizer:
    name: ThreadSanitizer (multi-threaded IT)
    needs: integration
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Build and run the TSan IT
        run: ./utils/build_tsan_tests.sh

  package-smoke:
    name: Package build + install + smoke test
    needs: [compiler-portability, unit-tests-coverage, sanitizers, thread-sanitizer]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config fakeroot
      - name: Build .deb
        run: ./utils/build_deb.sh
      - name: Install the built .debs (runtime + dev)
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          ARCH="$(dpkg --print-architecture)"
          DEB_RT="build/debs/libemlog_${VERSION}_${ARCH}.deb"
          DEB_DEV="build/debs/libemlog-dev_${VERSION}_${ARCH}.deb"
          for f in "${DEB_RT}" "${DEB_DEV}"; do
            if [[ ! -f "${f}" ]]; then
              echo "expected package not found: ${f}" >&2
              exit 1
            fi
          done
          sudo apt-get install -y "./${DEB_RT}" "./${DEB_DEV}"
      - name: Smoke test the installed package
        run: ./utils/smoke_test_package.sh
      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb-package
          if-no-files-found: error
          path: |
            build/debs/*.deb
            build/debs/SHA256SUMS
