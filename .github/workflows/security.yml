name: Security

# GCC's static analyzer (-fanalyzer), on push/PR plus a weekly scheduled run so drift in
# dependencies/toolchains still gets caught even without a code change.
#
# No CodeQL here: SARIF upload requires code-scanning to be entitled for the repo (GitHub
# Advanced Security on private repos), which this repo doesn't have, and CodeQL analysis is
# pure waste without the upload it feeds. Re-add a codeql job (mirroring uuid7/SPSCring/
# MPSCring's security.yml) if/when the repo goes public or GHAS gets enabled.

on:
  push:
    branches: [reorganization, main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-analyzer:
    name: GCC static analyzer (-fanalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config

      - name: Run GCC's static analyzer over the library source
        run: |
          gcc -std=c11 -Wall -Wextra -fanalyzer -Isrc -c src/emlog.c -o /tmp/emlog_analyzer.o
